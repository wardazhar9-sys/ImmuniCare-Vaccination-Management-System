services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-vaccination_management_system}
      MARIADB_USER: ${DB_USER:-immunicare}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - immunicare_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vaccination_management_system}
      DB_USER: ${DB_USER:-immunicare}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  immunicare_db:
