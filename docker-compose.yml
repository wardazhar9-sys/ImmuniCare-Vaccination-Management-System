services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: vaccination_test
      MARIADB_USER: tester
      MARIADB_PASSWORD: tester
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: vaccination_test
      DB_USER: tester
      DB_PASSWORD: tester
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: root
      APP_TIMEZONE: UTC
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: php -S 0.0.0.0:8080 -t /app
    ports:
      - "8080:8080"

  test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: vaccination_test
      DB_USER: tester
      DB_PASSWORD: tester
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: root
      APP_TIMEZONE: UTC
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php scripts/test_init.php && composer install --no-interaction && php vendor/bin/phpunit --coverage-clover build/logs/clover.xml && php scripts/check_coverage.php build/logs/clover.xml 100"

  browser:
    image: mcr.microsoft.com/playwright:v1.63.0-jammy
    working_dir: /app
    environment:
      BASE_URL: http://app:8080
    volumes:
      - .:/app
    depends_on:
      - app
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
