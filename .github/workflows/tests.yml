name: Tests

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, dom
          coverage: pcov
      - uses: ramsey/composer-install@v3
      - run: php -l includes/app.php
      - run: php vendor/bin/phpunit --coverage-clover build/logs/clover.xml --coverage-text
      - run: php scripts/check_coverage.php build/logs/clover.xml 100
      - run: '! rg -n "\\bPDO\\b|new\\s+PDO" --glob "*.php" --glob "!tests/**" .'
      - run: '! rg -n "body[^{}]*\\{[^}]*display\\s*:\\s*flex" assets/css'
